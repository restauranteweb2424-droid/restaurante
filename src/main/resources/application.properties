# Gestor Gastronómico - configuración
# Todo valor sensible se toma de variables de entorno; los valores por defecto sirven para desarrollo local.

server.port=${PORT:8080}

# Base de datos (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gestor_gastronomico_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JSON
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=America/Argentina/Buenos_Aires
spring.jackson.serialization.write-dates-as-timestamps=false
# Un campo que el servidor no conoce se ignora, así una versión nueva del panel no rompe el guardado.
spring.jackson.deserialization.fail-on-unknown-properties=false

# Logs
logging.level.com.gestorgastronomico=INFO
logging.level.org.springframework.security=WARN

# El logo y la portada viajan en base64 dentro de la configuración.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=10MB
server.tomcat.threads.max=20

# Seguridad
# JWT_SECRET: 32 caracteres o más. Si falta, JwtUtil genera una clave aleatoria en cada arranque.
jwt.secret=${JWT_SECRET:CambiameEnProduccionSecretJWTGenericoDelSistema2026}
jwt.expiration=86400000
# MASTER_KEY: clave para recuperar contraseñas desde el login. Con el valor de fábrica la recuperación queda desactivada.
app.master-key=${MASTER_KEY:admin2026}

# Copias de seguridad (mysqldump)
# Por defecto cada 3 horas, guardando los últimos 14 días. mysqldump se busca solo en el PATH
# y en las rutas habituales; BACKUP_MYSQLDUMP_PATH solo hace falta si no lo encuentra.
app.backup.enabled=${BACKUP_ENABLED:true}
app.backup.cron=${BACKUP_CRON:0 0 */3 * * *}
app.backup.dir=${BACKUP_DIR:backups}
app.backup.retention-days=${BACKUP_RETENTION_DAYS:14}
app.backup.mysqldump-path=${BACKUP_MYSQLDUMP_PATH:}
